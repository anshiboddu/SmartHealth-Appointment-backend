# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=smart-health-backend

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_health_appointment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Bootstrap Configuration
app.admin.email=${ADMIN_EMAIL:admin@smarthealth.com}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:1234567890}

# Logging
logging.level.com.healthappointment=INFO
logging.level.org.springframework.security=WARN
